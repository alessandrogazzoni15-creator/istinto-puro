name: Dati e pubblicazione

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 3 * * 1' # ogni lunedì alle 3 (UTC): dati aggiornati da Wikidata e Wikipedia
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm test

      # I dati scaricati restano in cache per la settimana: un push nei giorni successivi
      # ripubblica subito; il lunedì la chiave cambia e si riscarica tutto da capo.
      - name: Settimana corrente
        id: week
        run: echo "key=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: |
            scripts/.cache
            public/rosters
          key: data-${{ steps.week.outputs.key }}

      - name: Indice delle squadre
        if: github.event_name != 'push'
        run: npm run teams

      - name: Carriere da Wikipedia
        run: npm run careers

      - name: Archivio delle rose
        run: npm run rosters

      - name: Sito
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
