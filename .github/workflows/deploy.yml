name: Dati e pubblicazione

# Pubblicazione normale (push): usa l'archivio dei dati già pronto, salvato nella release
# "dati", e va online in pochi minuti.
# Ogni lunedì (o a mano con "aggiorna i dati"): rigenera indice, carriere e archivio da
# Wikidata e Wikipedia; solo se tutto va a buon fine aggiorna la release e il sito.
# Se qualcosa fallisce, online resta la versione precedente.

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:
    inputs:
      refresh:
        description: 'Aggiorna i dati da Wikidata e Wikipedia (circa 2 ore)'
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      GH_TOKEN: ${{ github.token }}
      REFRESH: ${{ github.event_name == 'schedule' || inputs.refresh == true }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm test

      - name: Dati dall'archivio
        if: env.REFRESH != 'true'
        run: |
          gh release download dati --pattern dati.tar.gz
          tar -xzf dati.tar.gz -C public

      - name: Dati aggiornati
        if: env.REFRESH == 'true'
        run: |
          npm run teams
          npm run careers
          npm run rosters
          tar -czf dati.tar.gz -C public rosters teams.json

      - name: Sito
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      # Solo dopo una build riuscita: la release "dati" viene sostituita dai dati nuovi
      - name: Salva i dati aggiornati
        if: env.REFRESH == 'true'
        run: gh release upload dati dati.tar.gz --clobber

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
