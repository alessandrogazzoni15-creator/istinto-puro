<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 100" role="img" aria-label="Istinto Puro">
  <!-- L'incrocio: due squadre inclinate in avanti; la parte in comune è il giocatore da indovinare -->
  <defs>
    <mask id="cuts" maskUnits="userSpaceOnUse" x="-20" y="-20" width="160" height="140">
      <rect x="-20" y="-20" width="160" height="140" fill="#fff"/>
      <!-- tagli diagonali: in alto a sinistra e in basso a destra, come gli angoli smussati -->
      <rect x="12.4" y="24.4" width="18" height="6" fill="#000" transform="rotate(45 21.4 27.4)"/>
      <rect x="89.6" y="69.6" width="18" height="6" fill="#000" transform="rotate(45 98.6 72.6)"/>
    </mask>
  </defs>
  <g transform="translate(10.6 0) skewX(-12)">
    <g mask="url(#cuts)" fill="none" stroke="#EEF6F0" stroke-width="6">
      <circle cx="44" cy="50" r="32"/>
      <circle cx="76" cy="50" r="32"/>
    </g>
    <path d="M60 22.29 A32 32 0 0 1 60 77.71 A32 32 0 0 1 60 22.29 Z" fill="#3BE36F"/>
  </g>
</svg>
